name: "Solar System"
on:
  push:
    branches:
      - main
      - "feature/*"

jobs:
  unit-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v7
      - name: Install Dependencies
        run: npm install
      - name: Run Unit Tests
        run: npm run test
